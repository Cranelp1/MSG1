<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Un hermoso día</title>

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-2G9XEWYX01"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());

        gtag('config', 'G-2G9XEWYX01');
    </script>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            overflow: hidden;
            background: linear-gradient(135deg, #c2185b, #ad1457);
            font-family: Arial, sans-serif;
        }

        /* MENSAJE */
        h1 {
            position: absolute;

            /* CENTRADO PERFECTO */
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);

            width: 90%;
            max-width: 900px;

            margin: 0;
            padding: 20px;

            text-align: center;

            color: white;

            /* Tamaño adaptable */
            font-size: clamp(28px, 5vw, 52px);

            /* Espacio entre líneas */
            line-height: 1.35;

            text-shadow:
                0 0 5px white,
                0 0 10px white,
                0 0 20px #ff80ab,
                0 0 30px #ff4081,
                0 0 40px #ff4081;

            z-index: 10;
        }

        /* CORAZONES */
        .corazon {
            position: absolute;
            width: var(--tamaño);
            height: var(--tamaño);

            transform: rotate(-45deg);

            animation: aparecer var(--duracion) ease-in-out forwards;
        }

        .corazon::before,
        .corazon::after {
            content: "";

            position: absolute;

            width: var(--tamaño);
            height: var(--tamaño);

            border-radius: 50%;

            background: inherit;
        }

        .corazon::before {
            top: calc(var(--tamaño) * -0.5);
            left: 0;
        }

        .corazon::after {
            top: 0;
            left: calc(var(--tamaño) * 0.5);
        }

        /* ANIMACIÓN */
        @keyframes aparecer {

            0% {
                transform: rotate(-45deg) scale(0);
                opacity: 0;
            }

            20% {
                opacity: 1;
            }

            80% {
                opacity: 0.9;
            }

            100% {
                transform: rotate(-45deg) scale(1);
                opacity: 0;
            }
        }

        /* COLORES */
        .rojo {
            background: #ff1744;
        }

        .rosado {
            background: #ff80ab;
        }

        .blanco {
            background: #ffffff;
        }


        /* =========================
           AJUSTES PARA CELULARES
           ========================= */

        @media (max-width: 600px) {

            h1 {
                width: 92%;

                padding: 10px;

                font-size: 30px;

                line-height: 1.4;
            }

        }


        /* CELULARES MUY PEQUEÑOS */

        @media (max-width: 380px) {

            h1 {
                width: 94%;

                font-size: 26px;

                line-height: 1.4;
            }

        }

    </style>
</head>


<body>

    <h1>
        Buenas noches 😊🌙<br>
        Espero que hayas tenido un buen día.<br>
        Que descanses mucho y que mañana tengas un excelente día.<br>
        Que duermas bien y que todo te salga muy bien mañana. ✨
    </h1>


    <script>

        function crearCorazon() {

            const corazon = document.createElement("div");

            corazon.classList.add("corazon");


            /* COLORES */

            const colores = [
                "rojo",
                "rosado",
                "blanco"
            ];

            const color =
                colores[
                    Math.floor(
                        Math.random() * colores.length
                    )
                ];

            corazon.classList.add(color);


            /* POSICIÓN */

            corazon.style.left =
                Math.random() * 97 + "vw";

            corazon.style.top =
                Math.random() * 92 + "vh";


            /* TAMAÑO */

            const tamaño =
                10 + Math.random() * 45;

            corazon.style.setProperty(
                "--tamaño",
                tamaño + "px"
            );


            /* DURACIÓN */

            const duracion =
                1.5 + Math.random() * 3;

            corazon.style.setProperty(
                "--duracion",
                duracion + "s"
            );


            /* CREAR */

            document.body.appendChild(corazon);


            /* ELIMINAR */

            setTimeout(() => {

                corazon.remove();

            }, (duracion + 0.5) * 1000);

        }


        /* CREAR CORAZONES */

        setInterval(crearCorazon, 100);

    </script>

</body>
</html>
